     paint-order="stroke"
     text-anchor="middle"
     lengthAdjust="spacingAndGlyphs">

    <!-- M -->
    <text x="512" y="415" font-size="52" textLength="64">--</text>

    <!-- o r -->
    <text x="512" y="510" font-size="40" textLength="156">--- .-.</text>

    <!-- s L -->
