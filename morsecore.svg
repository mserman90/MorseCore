  <path d="M 467 190 H 557 V 340 L 710 690
           Q 726 730 682 730 H 342
           Q 298 730 314 690 L 467 340 Z"
        fill="#0F172A"
        stroke="#22D3EE"
        stroke-width="36"
        stroke-linejoin="round"/>

  <!-- Şişenin içi: Mors kodu (duvarlara değmeden) -->
